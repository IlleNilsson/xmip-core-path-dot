[package]
name = "xmip-core-path-dot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-path-dot"
description = "Dot path technology: the Xmip content selector — names, ordinals, keys and the streaming wildcard — read and written over a JSON Stream, for promote, demote, route and process. A xmip-core-path technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The PathLanguage trait, the content a compiled path
# reads and the rewriting it writes live in path; the error in contract.
path = { workspace = true }
contract = { workspace = true }
xcore = { workspace = true }

# The one real parser, the same one the json-pointer technology reads with.
serde_json = "1"

[dev-dependencies]
# The Stream fixture, for the tests only (ADR-0044).
contract = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
